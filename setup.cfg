[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    alembic/versions,
    build,
    dist

nested-classes-whitelist = Config, Meta, Params
max-cognitive-score = 15
max-cognitive-average = 8
select = WPS, E99, FIN, AAA

ignore =
    D100,
    D104,
    B008,
    WPS404,
    WPS115,
    WPS226,
    WPS202

per-file-ignores =
    alembic/env.py: WPS437, WPS420, WPS201, WPS221
    alembic/versions/*: ALL
    src/server/consumer/worker.py: WPS201
    tests/*: WPS432, WPS442, S101, WPS218, WPS214, WPS204, WPS210, WPS226
