[project]
name = "payproc"
version = "0.0.1-a1"
description = "Asynchronous payment processing microservice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "faststream-fastapi>=1.4.0",
    "faststream[cli,rabbit]>=0.7.7",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8-aaa>=0.17.2",
    "flake8-final>=0.0.4",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "wemake-python-styleguide>=1.8.1",
]
test = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
preview = false
fix = true
target-version = "py313"
line-length = 120
pycodestyle.max-doc-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
external = ["WPS", "FIN"]
ignore = [
    "BLE001",
    "D100",
    "D104",
    "D107",
    "EM",
    "TRY003",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"**/alembic/**/*.py" = ["D103", "INP001"]
"**/tests/**/*.py" = ["D101", "D102", "D103", "D107", "PLC0415", "PLR2004", "S101", "S105", "S106", "SLF001"]
"**/tests/**/conftest.py" = ["FBT"]

[tool.mypy]
mypy_path = "src"
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "redundant-expr",
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "unimported-reveal",
  "deprecated",
  "exhaustive-match",
]

explicit_package_bases = true
ignore_missing_imports = true
extra_checks = true
strict = true
strict_equality_for_none = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing"
