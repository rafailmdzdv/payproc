services:
  postgres:
    image: postgres:16-alpine
    container_name: payproc_postgres_prod
    restart: always
    env_file: ../.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payproc"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payproc_rabbitmq_prod
    restart: always
    env_file: ../.env
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: payproc_api_prod
    restart: always
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run gunicorn server.api.app:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --error-logfile -"
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: payproc_consumer_prod
    restart: always
    command: uv run faststream run server.consumer.worker:app
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_prod_data:
  rabbitmq_prod_data:
